
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7" pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BatchRenameTool main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatchRenameTool-Windows-x64
          path: dist/BatchRenameTool.exe
